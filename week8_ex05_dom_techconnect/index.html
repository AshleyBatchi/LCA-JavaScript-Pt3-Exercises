<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TechConnect Developer Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container py-4">

<h1 class="text-center mb-4">
TechConnect Developer Hub
</h1>

<div class="mb-3">
<h4>
Developers Displayed:
<span id="developerCount">0</span>
</h4>
</div>

<input
type="text"
id="searchInput"
class="form-control mb-3"
placeholder="Search developers..."
>

<div class="mb-3">
<button id="toggleViewBtn" class="btn btn-primary">
Switch View
</button>
</div>

<div class="card p-3 mb-4">
<h3>Add Developer</h3>

<form id="developerForm">

<input
type="text"
id="name"
class="form-control mb-2"
placeholder="Developer Name"
>

<input
type="text"
id="role"
class="form-control mb-2"
placeholder="Role"
>

<input
type="text"
id="skills"
class="form-control mb-2"
placeholder="Skills (comma separated)"
>

<button class="btn btn-success">
Add Developer
</button>

</form>
</div>

<div id="developerContainer" class="row"></div>

</div>

<script src="js/main.js"></script>

</body>
</html>
